apiVersion: v1
kind: ServiceAccount
metadata:
  name: movie-rating-production-sa
  namespace: production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mongodb-reader-production
rules:
- apiGroups: ["mongodbcommunity.mongodb.com"]
  resources: ["mongodbcommunity"]
  verbs: ["get", "list", "patch", "update"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: movie-rating-production-mongodb-binding
subjects:
- kind: ServiceAccount
  name: movie-rating-production-sa
  namespace: production
roleRef:
  kind: ClusterRole
  name: mongodb-reader-production
  apiGroup: rbac.authorization.k8s.io