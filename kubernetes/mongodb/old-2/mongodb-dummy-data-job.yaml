apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-dummy-data
  namespace: test
spec:
  template:
    spec:
      containers:
      - name: mongo-dummy-data
        image: mongo:6.0.5
        env:
        - name: MONGODB_USERNAME
          valueFrom:
            secretKeyRef:
              name: mongodb-admin-credentials
              key: username
        - name: MONGODB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongodb-admin-credentials
              key: password
        - name: MONGODB_DATABASE
          valueFrom:
            configMapKeyRef:
              name: mongodb-config
              key: MONGODB_DATABASE
        command: ["/bin/bash"]
        args:
        - -c
        - |
          echo "Waiting for MongoDB to be ready..."
          until mongosh "mongodb://$MONGODB_USERNAME:$MONGODB_PASSWORD@mongodb-config-svc.test.svc.cluster.local:27017/$MONGODB_DATABASE?authSource=admin" --eval "db.runCommand('ping')" > /dev/null 2>&1; do
            echo "MongoDB not ready, waiting..."
            sleep 5
          done
          
          echo "MongoDB is ready, inserting dummy data..."
          mongosh "mongodb://$MONGODB_USERNAME:$MONGODB_PASSWORD@mongodb-config-svc.test.svc.cluster.local:27017/$MONGODB_DATABASE?authSource=admin" <<EOF
          
          // Create movies collection with dummy data
          db.movies.insertMany([
            { name: "Avatar", year: 2009, genre: "Sci-Fi", rating: 7.8 },
            { name: "Inception", year: 2010, genre: "Sci-Fi", rating: 8.8 },
            { name: "The Dark Knight", year: 2008, genre: "Action", rating: 9.0 },
            { name: "Forrest Gump", year: 1994, genre: "Drama", rating: 8.8 },
            { name: "The Matrix", year: 1999, genre: "Sci-Fi", rating: 8.7 }
          ]);
          
          EOF
      restartPolicy: Never
  backoffLimit: 3