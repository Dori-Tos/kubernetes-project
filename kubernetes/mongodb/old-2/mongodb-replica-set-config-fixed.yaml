apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: mongodb-config
  namespace: test
spec:
  members: 3
  type: ReplicaSet
  version: "6.0.5"
  security:
    authentication:
      modes: ["SCRAM"]
  users:
    - name: admin
      db: admin
      passwordSecretRef:
        name: mongodb-admin-password
      roles:
        - name: clusterAdmin
          db: admin
        - name: userAdminAnyDatabase
          db: admin
      scramCredentialsSecretName: mongodb-config-admin
    - name: appuser
      db: testdb
      passwordSecretRef:
        name: mongodb-app-password
      roles:
        - name: readWrite
          db: testdb
      scramCredentialsSecretName: mongodb-config-appuser
  additionalMongodConfig:
    sharding:
      clusterRole: configsvr 
  statefulSet:
    spec:
      template:
        spec:
          containers:
          - name: mongod
            readinessProbe:
              exec:
                command:
                - /bin/true
              initialDelaySeconds: 5
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
          - name: mongodb-agent
            readinessProbe:
              exec:
                command:
                - /bin/true
              initialDelaySeconds: 5
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
      volumeClaimTemplates:
        - metadata:
            name: data-volume
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 1Gi

---

