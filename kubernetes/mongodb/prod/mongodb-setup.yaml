# Production MongoDB Admin Password (same as default)
apiVersion: v1
kind: Secret
metadata:
  name: admin-password-secret
  namespace: production
type: Opaque
stringData:
  password: "admin123"  # Same password as default namespace
---
# Production MongoDB App User Password (same as default)
apiVersion: v1
kind: Secret
metadata:
  name: appuser-password-secret
  namespace: production
type: Opaque
stringData:
  password: "appuser123"  # Same password as default namespace
---
# Production MongoDB Community Configuration
apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: production-mongodb
  namespace: production
spec:
  members: 3
  type: ReplicaSet
  version: "6.0.5"
  security:
    authentication:
      modes: ["SCRAM"]
  users:
  - name: admin-user
    db: admin
    passwordSecretRef:
      name: admin-password-secret
    roles:
    - name: clusterAdmin
      db: admin
    - name: userAdminAnyDatabase  
      db: admin
    scramCredentialsSecretName: admin-user-scram
  - name: app-user
    db: admin
    passwordSecretRef:
      name: appuser-password-secret
    roles:
    - name: readWrite
      db: app-production  # Production database name
    scramCredentialsSecretName: app-user-scram
  additionalMongodConfig:
    storage.wiredTiger.engineConfig.journalCompressor: zlib