# Mongos Router Deployment (NOT managed by MCK operator)
# You need to deploy this separately as a regular Kubernetes Deployment

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongos-router
  namespace: test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mongos-router
  template:
    metadata:
      labels:
        app: mongos-router
    spec:
      containers:
      - name: mongos
        image: mongo:6.0.5
        command:
          - mongos
          - --configdb
          - configReplSet/config-server-0.config-server-svc.test.svc.cluster.local:27017,config-server-1.config-server-svc.test.svc.cluster.local:27017,config-server-2.config-server-svc.test.svc.cluster.local:27017
          - --bind_ip_all
          - --port
          - "27017"
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: "admin"
        - name: MONGO_INITDB_ROOT_PASSWORD
          value: "AdminPassword123!"

---
apiVersion: v1
kind: Service
metadata:
  name: mongos-service
  namespace: test
spec:
  selector:
    app: mongos-router
  ports:
  - port: 27017
    targetPort: 27017
  type: ClusterIP

---
# Manual setup script to initialize sharding
# This would need to be run manually after all components are up
apiVersion: v1
kind: ConfigMap
metadata:
  name: sharding-init-script
  namespace: test
data:
  init-sharding.js: |
    // Connect to mongos and initialize sharding
    
    // Add shards to the cluster
    sh.addShard("shard01ReplSet/shard-01-0.shard-01-svc.test.svc.cluster.local:27017,shard-01-1.shard-01-svc.test.svc.cluster.local:27017,shard-01-2.shard-01-svc.test.svc.cluster.local:27017");
    
    sh.addShard("shard02ReplSet/shard-02-0.shard-02-svc.test.svc.cluster.local:27017,shard-02-1.shard-02-svc.test.svc.cluster.local:27017,shard-02-2.shard-02-svc.test.svc.cluster.local:27017");
    
    // Enable sharding on your database
    sh.enableSharding("movie-ratings-db");
    
    // Create shard key for your collections
    sh.shardCollection("movie-ratings-db.movies", { "_id": 1 });
    sh.shardCollection("movie-ratings-db.reviews", { "movie": 1 });
    sh.shardCollection("movie-ratings-db.actors", { "name": 1 });
    
    // Verify sharding status
    sh.status();