apiVersion: kustomize.toolkit.fluxcd.io/v1beta1
kind: Kustomization
metadata:
  name: app-production  
  namespace: default
spec:
  interval: 10m
  path: "./kubernetes/app-production"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    branch: production
  targetNamespace: production