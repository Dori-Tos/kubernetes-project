apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie-rating
  namespace: test
spec:
  replicas: 3
  selector:
    matchLabels:
      app: movie-rating
  template:
    metadata:
      labels:
        app: movie-rating
    spec:
      containers:
      - name: movie-rating
        image: docker.io/library/app:v1.0
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        # Secret references (sensitive data)
        - name: MONGODB_USERNAME
          valueFrom:
            secretKeyRef:
              name: mongodb-admin-credentials
              key: username
        - name: MONGODB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongodb-admin-credentials
              key: password
        # ConfigMap references (non-sensitive data)
        - name: MONGODB_DATABASE
          valueFrom:
            configMapKeyRef:
              name: mongodb-config
              key: MONGODB_DATABASE
        - name: MONGODB_HOST
          valueFrom:
            configMapKeyRef:
              name: mongodb-config
              key: MONGODB_HOST
        - name: MONGODB_PORT
          valueFrom:
            configMapKeyRef:
              name: mongodb-config
              key: MONGODB_PORT
        - name: MONGODB_OPTIONS
          valueFrom:
            configMapKeyRef:
              name: mongodb-config
              key: MONGODB_OPTIONS
        # Constructed URI (done in container)
        - name: MONGODB_URI
          value: "mongodb://$(MONGODB_USERNAME):$(MONGODB_PASSWORD)@$(MONGODB_HOST):$(MONGODB_PORT)/$(MONGODB_DATABASE)?$(MONGODB_OPTIONS)"