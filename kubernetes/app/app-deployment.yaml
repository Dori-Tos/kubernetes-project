apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie-rating
  namespace: test
spec:
  replicas: 3
  selector:
    matchLabels:
      app: movie-rating
  template:
    metadata:
      labels:
        app: movie-rating
    spec:
      containers:
      - name: movie-rating
        image: docker.io/library/app:1.0
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        # Use the auto-generated MongoDB connection secret
        - name: MONGODB_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: example-mongodb-admin-app-user
              key: connectionString.standardSrv
        # Optional: Still expose individual credentials if needed
        - name: MONGODB_USERNAME
          valueFrom:
            secretKeyRef:
              name: example-mongodb-admin-app-user
              key: username
        - name: MONGODB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: example-mongodb-admin-app-user
              key: password
        # Database name for your application
        - name: MONGODB_DATABASE
          value: "movie-ratings-db"