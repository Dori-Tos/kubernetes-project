apiVersion: v1
kind: ServiceAccount
metadata:
  name: movie-rating-service-account
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: default
  name: mongodb-scaling-role
rules:
- apiGroups: ["mongodbcommunity.mongodb.com"]
  resources: ["mongodbcommunity"]
  verbs: ["get", "list", "watch", "patch", "update"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["statefulsets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mongodb-scaling-rolebinding
  namespace: default
subjects:
- kind: ServiceAccount
  name: movie-rating-service-account
  namespace: default
roleRef:
  kind: Role
  name: mongodb-scaling-role
  apiGroup: rbac.authorization.k8s.io